---
type: specs.openrewrite.org/v1beta/recipe
name: sh.stubborn.contract.migration.MigrateFromSpringCloudContract
displayName: Migrate from Spring Cloud Contract to Stubborn Contract
description: >-
  Composite recipe that updates Maven/Gradle coordinates, Java package names, and
  drops JUnit 4 StubRunner / Verifier usage. Run this after adding stubborn-contract-migration
  to your build's rewrite plugin configuration.
tags:
  - spring-cloud-contract
  - stubborn-contract
  - migration
recipeList:
  - sh.stubborn.contract.migration.UpdateDependencies
  - sh.stubborn.contract.migration.RenameJavaPackages
  - sh.stubborn.contract.migration.MigrateStubRunnerProperties
  - sh.stubborn.contract.migration.MigrateVerifierProperties
  - sh.stubborn.contract.migration.DropJUnit4Support

---
type: specs.openrewrite.org/v1beta/recipe
name: sh.stubborn.contract.migration.UpdateDependencies
displayName: Update Spring Cloud Contract coordinates to Stubborn Contract
description: >-
  Replaces org.springframework.cloud:spring-cloud-contract-* GAVs with
  sh.stubborn:stubborn-* equivalents, migrates the spring-cloud-contract-dependencies
  BOM, and swaps both build plugins, in Maven and Gradle builds alike. The
  com.toomuchcoding JSON/XML assertion coordinates are swapped alongside the
  sh.stubborn.jsonassert / sh.stubborn.xmlassert package renames. Every coordinate is
  repinned to latest.release, because a Spring Cloud Contract version carried over onto
  an sh.stubborn artifact was never published and fails to resolve.
tags:
  - spring-cloud-contract
  - stubborn-contract
  - gradle
recipeList:
  - org.openrewrite.java.dependencies.ChangeDependency:
      oldGroupId: org.springframework.cloud
      oldArtifactId: spring-cloud-contract-verifier
      newGroupId: sh.stubborn
      newArtifactId: stubborn-contract-verifier
      newVersion: latest.release
  - org.openrewrite.java.dependencies.ChangeDependency:
      oldGroupId: org.springframework.cloud
      oldArtifactId: spring-cloud-contract-stub-runner
      newGroupId: sh.stubborn
      newArtifactId: stubborn-contract-stub-runner
      newVersion: latest.release
  - org.openrewrite.java.dependencies.ChangeDependency:
      oldGroupId: org.springframework.cloud
      oldArtifactId: spring-cloud-starter-contract-verifier
      newGroupId: sh.stubborn
      newArtifactId: stubborn-contract-starter-verifier
      newVersion: latest.release
  - org.openrewrite.java.dependencies.ChangeDependency:
      oldGroupId: org.springframework.cloud
      oldArtifactId: spring-cloud-starter-contract-stub-runner
      newGroupId: sh.stubborn
      newArtifactId: stubborn-contract-starter-stub-runner
      newVersion: latest.release
  - org.openrewrite.java.dependencies.ChangeDependency:
      oldGroupId: org.springframework.cloud
      oldArtifactId: spring-cloud-starter-contract-stub-runner-jetty
      newGroupId: sh.stubborn
      newArtifactId: stubborn-contract-starter-stub-runner-jetty
      newVersion: latest.release
  - org.openrewrite.java.dependencies.ChangeDependency:
      oldGroupId: org.springframework.cloud
      oldArtifactId: spring-cloud-contract-wiremock
      newGroupId: sh.stubborn
      newArtifactId: stubborn-contract-wiremock
      newVersion: latest.release
  - org.openrewrite.java.dependencies.ChangeDependency:
      oldGroupId: org.springframework.cloud
      oldArtifactId: spring-cloud-contract-converters
      newGroupId: sh.stubborn
      newArtifactId: stubborn-contract-converters
      newVersion: latest.release
  - org.openrewrite.java.dependencies.ChangeDependency:
      oldGroupId: org.springframework.cloud
      oldArtifactId: spring-cloud-contract-spec
      newGroupId: sh.stubborn
      newArtifactId: stubborn-contract-spec
      newVersion: latest.release
  - org.openrewrite.java.dependencies.ChangeDependency:
      oldGroupId: org.springframework.cloud
      oldArtifactId: spring-cloud-contract-spec-java
      newGroupId: sh.stubborn
      newArtifactId: stubborn-contract-spec-java
      newVersion: latest.release
  - org.openrewrite.java.dependencies.ChangeDependency:
      oldGroupId: org.springframework.cloud
      oldArtifactId: spring-cloud-contract-spec-groovy
      newGroupId: sh.stubborn
      newArtifactId: stubborn-contract-spec-groovy
      newVersion: latest.release
  - org.openrewrite.java.dependencies.ChangeDependency:
      oldGroupId: org.springframework.cloud
      oldArtifactId: spring-cloud-contract-spec-kotlin
      newGroupId: sh.stubborn
      newArtifactId: stubborn-contract-spec-kotlin
      newVersion: latest.release
  - org.openrewrite.java.dependencies.ChangeDependency:
      oldGroupId: com.toomuchcoding.jsonassert
      oldArtifactId: jsonassert
      newGroupId: sh.stubborn
      newArtifactId: stubborn-contract-jsonassert
      newVersion: latest.release
  - org.openrewrite.java.dependencies.ChangeDependency:
      oldGroupId: com.toomuchcoding.xmlassert
      oldArtifactId: xmlassert
      newGroupId: sh.stubborn
      newArtifactId: stubborn-contract-xmlassert
      newVersion: latest.release
  - org.openrewrite.java.dependencies.ChangeDependency:
      oldGroupId: org.springframework.cloud
      oldArtifactId: spring-cloud-contract-dependencies
      newGroupId: sh.stubborn
      newArtifactId: stubborn-contract-dependencies
      newVersion: latest.release
  - org.openrewrite.maven.ChangePluginGroupIdAndArtifactId:
      oldGroupId: org.springframework.cloud
      oldArtifactId: spring-cloud-contract-maven-plugin
      newGroupId: sh.stubborn
      newArtifactId: stubborn-contract-maven-plugin
  - org.openrewrite.xml.RemoveXmlTag:
      xPath: /project/build/plugins/plugin[artifactId='stubborn-contract-maven-plugin']/version
      fileMatcher: '**/pom.xml'
  - org.openrewrite.maven.UpgradePluginVersion:
      groupId: sh.stubborn
      artifactId: stubborn-contract-maven-plugin
      newVersion: latest.release
      addVersionIfMissing: true
  - org.openrewrite.gradle.plugins.ChangePlugin:
      pluginId: org.springframework.cloud.contract
      newPluginId: sh.stubborn.contract
      newVersion: latest.release

---
type: specs.openrewrite.org/v1beta/recipe
name: sh.stubborn.contract.migration.RenameJavaPackages
displayName: Rename org.springframework.cloud.contract packages to sh.stubborn.contract
description: >-
  Recursively rewrites all Java import statements from
  org.springframework.cloud.contract.* to sh.stubborn.contract.*, and the JSON/XML
  assertion packages from com.toomuchcoding.* to sh.stubborn.*.
tags:
  - spring-cloud-contract
  - stubborn-contract
recipeList:
  - org.openrewrite.java.ChangePackage:
      oldPackageName: org.springframework.cloud.contract
      newPackageName: sh.stubborn.contract
      recursive: true
  - org.openrewrite.java.ChangePackage:
      oldPackageName: com.toomuchcoding.jsonassert
      newPackageName: sh.stubborn.jsonassert
      recursive: true
  - org.openrewrite.java.ChangePackage:
      oldPackageName: com.toomuchcoding.xmlassert
      newPackageName: sh.stubborn.xmlassert
      recursive: true

---
type: specs.openrewrite.org/v1beta/recipe
name: sh.stubborn.contract.migration.MigrateStubRunnerProperties
displayName: Migrate deprecated Stub Runner property prefix to the canonical one
description: >-
  Renames the deprecated Stub Runner property prefix
  spring.cloud.contract.stubrunner.* to its canonical stubborn.contract.stubrunner.*
  equivalent in Spring Boot application.properties and application.yml/yaml files.
  The legacy prefix still resolves at runtime via StubRunnerPropertiesMigrator, but it
  emits deprecation warnings and is slated for removal in the next major release; this
  recipe removes the warnings by rewriting the keys. The verifier property subset is
  handled separately by MigrateVerifierProperties.
tags:
  - spring-cloud-contract
  - stubborn-contract
  - properties
recipeList:
  - org.openrewrite.properties.ChangePropertyKey:
      oldPropertyKey: spring\.cloud\.contract\.stubrunner\.(.+)
      newPropertyKey: stubborn.contract.stubrunner.$1
      regex: true
  - org.openrewrite.yaml.ChangePropertyKey:
      oldPropertyKey: spring.cloud.contract.stubrunner
      newPropertyKey: stubborn.contract.stubrunner

---
type: specs.openrewrite.org/v1beta/recipe
name: sh.stubborn.contract.migration.MigrateVerifierProperties
displayName: Migrate deprecated Verifier property prefix to the canonical one
description: >-
  Renames the deprecated Verifier property prefix spring.cloud.contract.verifier.* to its
  canonical stubborn.contract.verifier.* equivalent in Spring Boot application.properties
  and application.yml/yaml files. The Stubborn Contract Maven plugin exposes these as
  -Dstubborn.contract.verifier.* system properties; the legacy names are still accepted for
  the string parameters and via this recipe for configuration files, and are slated for
  removal in the next major release.
tags:
  - spring-cloud-contract
  - stubborn-contract
  - properties
recipeList:
  - org.openrewrite.properties.ChangePropertyKey:
      oldPropertyKey: spring\.cloud\.contract\.verifier\.(.+)
      newPropertyKey: stubborn.contract.verifier.$1
      regex: true
  - org.openrewrite.yaml.ChangePropertyKey:
      oldPropertyKey: spring.cloud.contract.verifier
      newPropertyKey: stubborn.contract.verifier

---
type: specs.openrewrite.org/v1beta/recipe
name: sh.stubborn.contract.migration.DropJUnit4Support
displayName: Migrate StubRunner JUnit 4 Rule to JUnit 5 Extension
description: >-
  Replaces @Rule StubRunnerRule / StubRunnerClassRule with
  @RegisterExtension StubRunnerExtension (JUnit 5). Requires JUnit 5 on the
  test classpath.
tags:
  - junit4
  - junit5
  - stubborn-contract
recipeList:
  - org.openrewrite.java.ChangeType:
      oldFullyQualifiedTypeName: sh.stubborn.contract.stubrunner.junit.StubRunnerRule
      newFullyQualifiedTypeName: sh.stubborn.contract.stubrunner.junit.StubRunnerExtension
  - org.openrewrite.java.ChangeType:
      oldFullyQualifiedTypeName: sh.stubborn.contract.stubrunner.junit.StubRunnerClassRule
      newFullyQualifiedTypeName: sh.stubborn.contract.stubrunner.junit.StubRunnerExtension
