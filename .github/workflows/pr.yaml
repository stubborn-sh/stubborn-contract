name: PR

on:
  pull_request:
    branches: [ main ]

permissions:
  contents: read
  checks: write

env:
  JAVA_VERSION: '17'
  JAVA_DISTRIBUTION: 'temurin'

jobs:
  build:
    name: Build & Verify
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v4

      - name: Set up JDK ${{ env.JAVA_VERSION }}
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v4
        with:
          java-version: ${{ env.JAVA_VERSION }}
          distribution: ${{ env.JAVA_DISTRIBUTION }}
          cache: maven

      - name: Build stubborn-contract-build parent
        run: ./mvnw install -f stubborn-contract-build/pom.xml -DskipTests --no-transfer-progress

      - name: Install BOM (stubborn-contract-dependencies)
        run: |
          find ~/.m2/repository/sh/stubborn -name "*.lastUpdated" -delete 2>/dev/null || true
          ./mvnw install -N -f stubborn-contract-dependencies/pom.xml -DskipTests --no-transfer-progress

      - name: Build & test
        run: |
          set -o pipefail
          ./mvnw clean install -B --no-transfer-progress 2>&1 | tee /tmp/build.log

      # TEMPORARY DIAGNOSTIC: surface the failing module/test in the readable
      # log tail (the dorny reporter only captures surefire and its 25 KB output
      # otherwise shadows the maven error). Revert once the failure is pinned.
      - name: Dump failure summary
        if: failure()
        run: |
          echo "================ MAVEN REACTOR SUMMARY ================"
          awk '/Reactor Summary/{p=1} p{print}' /tmp/build.log | tail -160
          echo "================ FAILURE / ERROR LINES ================"
          grep -nE "BUILD FAILURE|<<< FAILURE!|<<< ERROR!|Tests run: .*(Failures|Errors): [1-9]|Failed to execute goal|Caused by|\[ERROR\]" /tmp/build.log | tail -200
