name: Release Script Tests

on:
  push:
    branches: [ main ]
    paths:
      - 'scripts/release/**'
      - 'test/bats/**'
      - '.github/workflows/release-script-tests.yml'
  pull_request:
    branches: [ main ]
    paths:
      - 'scripts/release/**'
      - 'test/bats/**'
      - '.github/workflows/release-script-tests.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  bats:
    name: Release Script BATS Tests
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: Install bats
        run: sudo apt-get update && sudo apt-get install -y bats

      - name: Syntax-check release scripts
        run: |
          for s in scripts/release/*.sh; do
            echo "bash -n $s"
            bash -n "$s"
          done

      - name: Run BATS suite
        run: bats test/bats
