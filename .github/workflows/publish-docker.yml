name: Publish Docker Images

# Publishes the verifier (stubborn-contract) and stub-runner
# (stubborn-contract-stub-runner) images to Docker Hub.
#
# TWO THINGS TO KNOW BEFORE EDITING:
#
# 1. This runs `deploy`, not `package`. dockerfile-maven-plugin binds its
#    `build` goal to `package` but its `push` goal to `deploy`. Running
#    `package` here builds both images, pushes neither, and exits 0 — which is
#    what happened for the first 139 runs of this workflow, during which
#    nothing was ever published. Artifact deployment itself is skipped
#    (maven-deploy-plugin skip=true in docker/pom.xml, plus -Dmaven.deploy.skip
#    below); the only thing the deploy phase is wanted for is the image push.
#
# 2. The run ends by asking the registry whether the images are really there.
#    A publish workflow that cannot fail is not a publish workflow.

on:
  push:
    branches: [main]
    tags: ['v*.*.*']
  workflow_dispatch:
    inputs:
      version:
        description: 'Release version to publish (e.g. 0.1.2). Leave empty for the latest GitHub release.'
        required: false
        default: ''
  workflow_call:
    inputs:
      version:
        description: 'Release version to publish (e.g. 0.1.2).'
        required: true
        type: string

permissions:
  contents: read

env:
  JAVA_VERSION: '17'
  JAVA_DISTRIBUTION: 'temurin'
  DOCKER_ORG: mgrzejszczak

jobs:
  resolve:
    name: Resolve what to publish
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.target.outputs.version }}
      ref: ${{ steps.target.outputs.ref }}
      push_latest: ${{ steps.target.outputs.push_latest }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v4

      - name: Resolve target
        id: target
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          INPUT_VERSION: ${{ inputs.version }}
        run: ./scripts/ci/resolve-docker-publish.sh

  publish:
    name: Build & Push Docker Images
    needs: resolve
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v4
        with:
          ref: ${{ needs.resolve.outputs.ref }}

      - name: Set up JDK ${{ env.JAVA_VERSION }}
        uses: actions/setup-java@dd06d9cba3e5552c54d9f8ea23572deb30010f7c # v4
        with:
          java-version: ${{ env.JAVA_VERSION }}
          distribution: ${{ env.JAVA_DISTRIBUTION }}
          cache: maven

      - name: Log in to Docker Hub
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build stubborn-contract-build parent
        run: ./mvnw install -f stubborn-contract-build/pom.xml -DskipTests --no-transfer-progress

      - name: Install BOM
        run: ./scripts/ci/install-bom.sh

      - name: Build & install all modules (no tests)
        run: ./mvnw install -DskipTests --no-transfer-progress

      - name: Build docker module parents
        run: ./mvnw install -N -f docker/pom.xml -DskipTests --no-transfer-progress

      - name: Resolve the version the images are tagged with
        id: pom
        run: ./scripts/ci/project-version.sh docker/stubborn-contract-docker/pom.xml

      - name: Build & push stubborn-contract Docker image
        run: ./scripts/ci/publish-docker-image.sh docker/stubborn-contract-docker/pom.xml
        env:
          DOCKER_HUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
          DOCKER_HUB_PASSWORD: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build & push stubborn-contract-stub-runner Docker image
        run: ./scripts/ci/publish-docker-image.sh docker/stubborn-contract-stub-runner-docker/pom.xml
        env:
          DOCKER_HUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
          DOCKER_HUB_PASSWORD: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Tag images as latest
        if: needs.resolve.outputs.push_latest == 'true'
        run: ./scripts/ci/push-latest-tags.sh "$DOCKER_ORG" "${{ needs.resolve.outputs.version }}"

      - name: Verify the images reached the registry
        run: >-
          ./scripts/ci/verify-docker-images.sh "$DOCKER_ORG"
          "${{ steps.pom.outputs.version }}"
          ${{ needs.resolve.outputs.push_latest == 'true' && 'latest' || '' }}

      # The step above only asks the registry whether the image EXISTS. This one
      # pulls the just-published stub-runner image and actually RUNS it, so an
      # image that does not boot (e.g. a non-executable jar — stubborn-sh/stubborn#91)
      # fails the publish instead of reaching users. Pull explicitly so we exercise
      # the pushed image, not a stale local build.
      - name: Smoke-boot the published stub-runner image
        run: |
          IMAGE="${DOCKER_ORG}/stubborn-contract-stub-runner:${{ steps.pom.outputs.version }}"
          docker pull "${IMAGE}"
          ./scripts/ci/smoke-boot-stub-runner.sh "${IMAGE}"
