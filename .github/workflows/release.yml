name: Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Release version (e.g. 0.1.0)'
        required: true
      next-snapshot:
        description: 'Next SNAPSHOT version (e.g. 0.2.0-SNAPSHOT)'
        required: true
        default: '0.2.0-SNAPSHOT'
      dryRun:
        description: 'Staged dry-run: deploy to Central Portal (validated/pending, never auto-published) but skip tag / GitHub release / next-snapshot commit.'
        type: boolean
        required: false
        default: false

permissions:
  contents: write

env:
  JAVA_VERSION: '21'
  JAVA_DISTRIBUTION: 'temurin'

jobs:
  release:
    name: Release to Maven Central
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up JDK ${{ env.JAVA_VERSION }}
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v4
        with:
          java-version: ${{ env.JAVA_VERSION }}
          distribution: ${{ env.JAVA_DISTRIBUTION }}
          cache: maven
          server-id: central
          server-username: CENTRAL_USERNAME
          server-password: CENTRAL_PASSWORD
          gpg-private-key: ${{ secrets.GPG_PRIVATE_KEY }}
          gpg-passphrase: GPG_PASSPHRASE

      - name: Validate version format
        run: ./scripts/release/validate-version.sh "${{ inputs.version }}"

      - name: Set release version
        # Extracted to scripts/release/set-release-version.sh (unit-tested via test/bats).
        # Runs the two versions:set calls (reactor + build parent), finalizes the two
        # out-of-reactor <parent> refs (root + BOM), and rewrites verifierVersion in the
        # Docker image's concrete gradle.properties (the docker module's drift check
        # enforces the match against project.version).
        run: scripts/release/set-release-version.sh "${{ inputs.version }}"

      - name: Build stubborn-contract-build parent
        run: ./mvnw install -f stubborn-contract-build/pom.xml -DskipTests --no-transfer-progress

      - name: Install BOM (stubborn-contract-dependencies)
        run: |
          find ~/.m2/repository/sh/stubborn -name "*.lastUpdated" -delete 2>/dev/null || true
          ./mvnw install -N -f stubborn-contract-dependencies/pom.xml -DskipTests --no-transfer-progress

      - name: Build & test
        run: ./mvnw clean install --no-transfer-progress

      - name: Fail if any SNAPSHOT version remains
        # Extracted to scripts/release/assert-no-snapshots.sh (unit-tested via test/bats).
        run: scripts/release/assert-no-snapshots.sh

      - name: Deploy stubborn-contract-build to Maven Central
        run: ./mvnw deploy -Ppublish,release -DskipTests -Dcentral.autoPublish=false --no-transfer-progress -f stubborn-contract-build/pom.xml
        env:
          CENTRAL_USERNAME: ${{ secrets.CENTRAL_USERNAME }}
          CENTRAL_PASSWORD: ${{ secrets.CENTRAL_PASSWORD }}
          GPG_PASSPHRASE: ${{ secrets.GPG_PASSPHRASE }}

      - name: Deploy all modules to Maven Central
        run: ./mvnw deploy -Ppublish,release -DskipTests -Dcentral.autoPublish=false --no-transfer-progress
        env:
          CENTRAL_USERNAME: ${{ secrets.CENTRAL_USERNAME }}
          CENTRAL_PASSWORD: ${{ secrets.CENTRAL_PASSWORD }}
          GPG_PASSPHRASE: ${{ secrets.GPG_PASSPHRASE }}

      - name: Tag release & push
        if: ${{ !inputs.dryRun }}
        run: scripts/release/tag-and-push.sh "${{ inputs.version }}"

      - name: Create GitHub Release
        if: ${{ !inputs.dryRun }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: scripts/release/create-github-release.sh "${{ inputs.version }}"

      - name: Set next SNAPSHOT version
        # Routed through set-release-version.sh (not a bare versions:set) so the
        # Docker gradle.properties and parent refs stay in sync with the poms —
        # otherwise the docker drift check fails on the next main build.
        if: ${{ !inputs.dryRun }}
        run: scripts/release/back-to-snapshot.sh "${{ inputs.next-snapshot }}"
