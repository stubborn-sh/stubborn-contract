name: Docs Check

on:
  pull_request:
    branches: [ main ]
  push:
    branches: [ main ]

permissions:
  contents: read

jobs:
  docs:
    name: Docs alignment & build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install
        run: npm install --no-audit --no-fund

      # Regenerate the code-derived reference tables and fail if they differ from what's
      # committed (i.e. the Java source changed but the docs weren't regenerated), or if the
      # descriptions are out of sync with the model, or a reference doc/example uses a schema
      # name that does not exist.
      - name: Reference tables are in sync with the code
        run: npm run docs:gen:check

      # Fail if any <!--@include--> partial or <<< snippet-import target is missing, if any
      # local link does not resolve, or if any external link resolves to a 404/410. Runs before
      # the build so a missing include fails fast with a clear message instead of being silently
      # inlined as an error string by VitePress.
      - name: Includes, snippets and links resolve
        run: npm run docs:check

      # Builds the site: re-validates every <!--@include--> partial and every <<< snippet import
      # path resolves, runs VitePress' own dead-link detection, and runs the drift guard again.
      - name: Build docs
        run: npm run docs:build

      - name: Built-site reachability check
        run: bash scripts/check-docs-links.sh
