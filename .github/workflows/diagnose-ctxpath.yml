name: Diagnose context-path stub runner

# TEMPORARY. Throwaway branch only — never merged. The full CI log is ~82k lines and
# only its tail is readable from this session, which hides the root cause of the
# context-path module's ApplicationContext failure. This builds just that module so the
# failure is the last thing in a short log, with surefire printing to the console.

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v4

      - name: Set up JDK 17
        uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: maven

      - name: Install the module's dependencies
        run: ./mvnw -B -ntp -pl tests/stubborn-contract-stub-runner-context-path -am -DskipTests -Dspring-javaformat.skip=true install

      - name: Print the resolved stub-runner classpath
        run: ./mvnw -B -ntp -pl tests/stubborn-contract-stub-runner-context-path dependency:tree -Dscope=test

      - name: Run only the failing test, trace to stdout
        run: ./mvnw -B -ntp -pl tests/stubborn-contract-stub-runner-context-path -Dsurefire.useFile=false -DtrimStackTrace=false test
