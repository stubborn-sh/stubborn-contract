name: Diagnose context-path stub runner

# TEMPORARY. Throwaway branch only — never merged. The full CI log is ~82k lines and
# only its tail is readable from this session, which hides the root cause of the
# context-path module's ApplicationContext failure. This builds just that module so the
# failure is the last thing in a short log, with surefire printing to the console.

on:
  push:
    branches: [ claude/diagnose-ctxpath ]

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v4

      - name: Set up JDK 17
        uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: maven

      # Mirrors ci.yaml: the parent POM and the BOM are outside the main reactor, so
      # they have to be installed before anything resolves against 0.1.4-SNAPSHOT.
      - name: Build stubborn-contract-build parent
        run: ./mvnw install -f stubborn-contract-build/pom.xml -DskipTests --no-transfer-progress -q

      - name: Install BOM (stubborn-contract-dependencies)
        run: |
          find ~/.m2/repository/sh/stubborn -name "*.lastUpdated" -delete 2>/dev/null || true
          ./mvnw install -N -f stubborn-contract-dependencies/pom.xml -DskipTests --no-transfer-progress -q

      - name: Install the module's dependencies
        run: ./mvnw -B -ntp -pl tests/stubborn-contract-stub-runner-context-path -am -DskipTests -Dspring-javaformat.skip=true install

      - name: Print the resolved stub-runner classpath
        continue-on-error: true
        run: ./mvnw -B -ntp -pl tests/stubborn-contract-stub-runner-context-path dependency:tree

      - name: Run only the failing test
        continue-on-error: true
        run: ./mvnw -B -ntp -pl tests/stubborn-contract-stub-runner-context-path -DtrimStackTrace=false test

      # The console summary only carries the top-level IllegalStateException; the
      # Caused-by chain lives in the surefire report. Print the causes LAST so they are
      # the end of the log.
      - name: Dump the root cause
        run: |
          echo '===== Caused by chain ====='
          grep -h -A6 'Caused by' tests/stubborn-contract-stub-runner-context-path/target/surefire-reports/*.txt || echo 'no Caused by found'
          echo '===== full report ====='
          cat tests/stubborn-contract-stub-runner-context-path/target/surefire-reports/*.txt | head -120
