name: Publish Snapshots

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read

env:
  JAVA_VERSION: '17'
  JAVA_DISTRIBUTION: 'temurin'

jobs:
  test:
    name: Build & Test
    runs-on: ubuntu-latest
    outputs:
      is_snapshot: ${{ steps.version.outputs.is_snapshot }}

    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: Set up JDK ${{ env.JAVA_VERSION }}
        uses: actions/setup-java@c1e323688fd81a25caa38c78aa6df2d33d3e20d9 # v4
        with:
          java-version: ${{ env.JAVA_VERSION }}
          distribution: ${{ env.JAVA_DISTRIBUTION }}
          cache: maven

      - name: Check project version is SNAPSHOT
        id: version
        # The Release workflow pushes a transient non-SNAPSHOT "Release x.y.z" commit to main
        # before restoring the next SNAPSHOT. On that commit a snapshot publish is a no-op, so we
        # record the result as an output and SKIP the publish job (below) rather than failing red.
        # SNAPSHOT detection is extracted to scripts/release/is-snapshot.sh (unit-tested via test/bats).
        run: |
          IS_SNAPSHOT=$(scripts/release/is-snapshot.sh)
          echo "is_snapshot=$IS_SNAPSHOT" >> "$GITHUB_OUTPUT"
          if [ "$IS_SNAPSHOT" = "true" ]; then
            echo "Project version is a SNAPSHOT — snapshot publish will run."
          else
            echo "::notice::Project version is not a SNAPSHOT (likely the transient release commit) — skipping snapshot publish."
          fi

      - name: Build stubborn-contract-build parent
        run: ./mvnw install -f stubborn-contract-build/pom.xml -DskipTests --no-transfer-progress

      - name: Install BOM (stubborn-contract-dependencies)
        run: |
          find ~/.m2/repository/sh/stubborn -name "*.lastUpdated" -delete 2>/dev/null || true
          ./mvnw install -N -f stubborn-contract-dependencies/pom.xml -DskipTests --no-transfer-progress

      - name: Build & test
        run: ./mvnw clean install --no-transfer-progress

  publish:
    name: Publish Snapshots to Maven Central
    runs-on: ubuntu-latest
    needs: test
    if: ${{ needs.test.outputs.is_snapshot == 'true' }}

    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: Set up JDK ${{ env.JAVA_VERSION }}
        uses: actions/setup-java@c1e323688fd81a25caa38c78aa6df2d33d3e20d9 # v4
        with:
          java-version: ${{ env.JAVA_VERSION }}
          distribution: ${{ env.JAVA_DISTRIBUTION }}
          cache: maven
          server-id: central
          server-username: CENTRAL_USERNAME
          server-password: CENTRAL_PASSWORD

      - name: Build stubborn-contract-build parent
        run: ./mvnw install -f stubborn-contract-build/pom.xml -DskipTests --no-transfer-progress

      - name: Install BOM (stubborn-contract-dependencies)
        run: |
          find ~/.m2/repository/sh/stubborn -name "*.lastUpdated" -delete 2>/dev/null || true
          ./mvnw install -N -f stubborn-contract-dependencies/pom.xml -DskipTests --no-transfer-progress

      - name: Build & install (skip tests — already tested in test job)
        run: ./mvnw clean install -DskipTests --no-transfer-progress

      - name: Deploy stubborn-contract-build to Maven Central
        run: ./mvnw deploy -Ppublish -DskipTests --no-transfer-progress -f stubborn-contract-build/pom.xml
        env:
          CENTRAL_USERNAME: ${{ secrets.CENTRAL_USERNAME }}
          CENTRAL_PASSWORD: ${{ secrets.CENTRAL_PASSWORD }}

      - name: Deploy all modules to Maven Central
        run: ./mvnw deploy -Ppublish -DskipTests --no-transfer-progress
        env:
          CENTRAL_USERNAME: ${{ secrets.CENTRAL_USERNAME }}
          CENTRAL_PASSWORD: ${{ secrets.CENTRAL_PASSWORD }}
