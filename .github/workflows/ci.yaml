name: Stubborn Contract CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  schedule:
    - cron: '0 6 * * *'
  workflow_dispatch:

permissions:
  contents: read
  checks: write

env:
  JAVA_VERSION: '17'
  JAVA_DISTRIBUTION: 'temurin'

jobs:
  detect-changes:
    name: Detect Changed Modules
    runs-on: ubuntu-latest
    outputs:
      modules: ${{ steps.detect.outputs.modules }}
      full_build: ${{ steps.detect.outputs.full_build }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v4
        with:
          fetch-depth: 0

      - name: Detect changed Maven modules
        id: detect
        run: |
          # On push to main or schedule/dispatch: full build
          if [[ "${{ github.event_name }}" != "pull_request" ]]; then
            echo "full_build=true" >> "$GITHUB_OUTPUT"
            echo "modules=" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          BASE="${{ github.event.pull_request.base.sha }}"
          HEAD="${{ github.sha }}"
          CHANGED=$(git diff --name-only "$BASE" "$HEAD" 2>/dev/null || git diff --name-only HEAD~1 HEAD)

          # Map top-level directory to Maven module path
          MODULES=""
          declare -A SEEN
          while IFS= read -r file; do
            dir=$(echo "$file" | cut -d/ -f1)
            # Skip non-module top-level paths
            [[ "$dir" == ".github" || "$dir" == "docs" || "$dir" == "config" || "$dir" == "scripts" ]] && continue
            # Shared build config (checkstyle, etc.) or Maven wrapper config affects every
            # module → full build. Without this the change maps to no module and the
            # detection silently narrows to an unrelated subset.
            if [[ "$dir" == "src" || "$dir" == ".mvn" ]]; then
              echo "full_build=true" >> "$GITHUB_OUTPUT"
              echo "modules=" >> "$GITHUB_OUTPUT"
              exit 0
            fi
            # Any pom.xml change (root, build parent, or a module) → full build. A
            # dependency or version change can reshape the reactor's resolution graph,
            # and a partial reactor built with --also-make-dependents may then pull in a
            # dependent whose own upstream sibling is NOT in the reactor and is not
            # published as a snapshot, breaking resolution (e.g. a change under
            # stubborn-contract-verifier* drags in stubborn-contract-wiremock-spring via
            # -amd, which needs stubborn-contract-wiremock — an artifact -am never adds).
            # Building everything from source keeps the reactor self-consistent.
            if [[ "$file" == "pom.xml" || "$file" == *"/pom.xml" ]]; then
              echo "full_build=true" >> "$GITHUB_OUTPUT"
              echo "modules=" >> "$GITHUB_OUTPUT"
              exit 0
            fi
            # Aggregator module (packaging=pom with <modules>, e.g. stubborn-contract-starters,
            # specs) → full build. Selecting the aggregator with --also-make-dependents pulls its
            # sibling submodules into the reactor WITHOUT their own upstream modules, which then
            # cannot be resolved (they are not published to the configured snapshot repo). Building
            # everything from source keeps the reactor self-consistent.
            if [[ -f "$dir/pom.xml" ]] && grep -q "<modules>" "$dir/pom.xml"; then
              echo "full_build=true" >> "$GITHUB_OUTPUT"
              echo "modules=" >> "$GITHUB_OUTPUT"
              exit 0
            fi
            [[ -n "${SEEN[$dir]}" ]] && continue
            SEEN[$dir]=1
            [[ -d "$dir" && -f "$dir/pom.xml" ]] && MODULES="${MODULES:+$MODULES,}$dir"
          done <<< "$CHANGED"

          if [[ -z "$MODULES" ]]; then
            echo "full_build=true" >> "$GITHUB_OUTPUT"
            echo "modules=" >> "$GITHUB_OUTPUT"
          else
            echo "full_build=false" >> "$GITHUB_OUTPUT"
            echo "modules=$MODULES" >> "$GITHUB_OUTPUT"
          fi

  build:
    name: Build & Test
    runs-on: ubuntu-latest
    needs: detect-changes

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v4

      - name: Set up JDK ${{ env.JAVA_VERSION }}
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v4
        with:
          java-version: ${{ env.JAVA_VERSION }}
          distribution: ${{ env.JAVA_DISTRIBUTION }}
          cache: maven

      - name: Build stubborn-contract-build parent
        run: ./mvnw install -f stubborn-contract-build/pom.xml -DskipTests --no-transfer-progress -q

      - name: Install BOM (stubborn-contract-dependencies)
        run: |
          find ~/.m2/repository/sh/stubborn -name "*.lastUpdated" -delete 2>/dev/null || true
          ./mvnw install -N -f stubborn-contract-dependencies/pom.xml -DskipTests --no-transfer-progress -q

      - name: Build & test (full)
        if: needs.detect-changes.outputs.full_build == 'true'
        run: ./mvnw clean install --no-transfer-progress

      - name: Build & test (changed modules + dependents)
        if: needs.detect-changes.outputs.full_build == 'false'
        run: |
          MODULES="${{ needs.detect-changes.outputs.modules }}"
          echo "Building modules: $MODULES (plus dependents)"
          ./mvnw clean install --no-transfer-progress \
            --projects "$MODULES" \
            --also-make \
            --also-make-dependents

      - name: Publish test results
        if: always()
        uses: dorny/test-reporter@a43b3a5f7366b97d083190328d2c652e1a8b6aa2 # v3.0.0
        with:
          name: Test Results
          path: '**/target/surefire-reports/TEST-*.xml,**/target/failsafe-reports/TEST-*.xml'
          reporter: java-junit
          fail-on-error: false
