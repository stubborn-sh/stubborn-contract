name: Publish GitHub Release
on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to release (e.g. 0.1.0) — must be an existing git tag v<version>'
        required: true

permissions:
  contents: write

jobs:
  github-release:
    name: GitHub Release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v4
        with:
          ref: "v${{ inputs.version }}"

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: scripts/release/create-github-release.sh "${{ inputs.version }}"
