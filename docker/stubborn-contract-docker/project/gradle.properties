org.gradle.daemon=false
org.gradle.parallel=false
# NOTE: verifierVersion / camelVersion / springBootVersion are Maven placeholders. They are
# NOT consumed from this source file directly — maven-resources-plugin filters this file into
# target/docker-context/gradle.properties at build time (see docker/stubborn-contract-docker/pom.xml),
# resolving them from Maven (project.version, camel.version, spring-boot.version). That filtered
# copy is what the Docker image uses. This keeps Maven the single source of truth for versions.
verifierVersion=${project.version}
springBootVersion=${spring-boot.version}
camelVersion=${camel.version}
