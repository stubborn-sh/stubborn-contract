stubborn.contract.stubrunner:
  repository-root: stubs:classpath:/stubs/
  ids: my:stubs
  stubs-mode: remote
  kafka:
    enabled: true
spring:
  kafka:
    # bootstrap-servers is supplied by the @DynamicPropertySource pointing at the
    # Testcontainers Kafka broker (see KafkaStubRunnerSpec).
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.springframework.kafka.support.serializer.JsonSerializer
      properties:
        "spring.json.trusted.packages": "*"
    consumer:
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.springframework.kafka.support.serializer.JsonDeserializer
      properties:
        "spring.json.trusted.packages": "*"
      group-id: ${random.value}
      auto-offset-reset: earliest
server:
  port: 0
debug: true
logging.level.sh.stubborn.contract: debug
