stubborn.contract.stubrunner:
  repository-root: stubs:classpath:/stubs/
  ids: my:stubs
  stubs-mode: remote
  kafka:
    enabled: true
spring:
  kafka:
    # bootstrap-servers is supplied by the @DynamicPropertySource in KafkaStubRunnerSpec,
    # pointing at the Testcontainers Kafka broker.
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.springframework.kafka.support.serializer.JsonSerializer
      properties:
        "spring.json.trusted.packages": "*"
    consumer:
      # The stub-runner publishes the contract's output via the Spring-free StubbornKafka
      # producer as raw JSON bytes with no Spring-Kafka type headers, so a JsonDeserializer
      # would fail with a SerializationException. Consume the value as a String and parse
      # the JSON in the test assertion instead.
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      group-id: ${random.value}
      auto-offset-reset: earliest
server:
  port: 0
debug: true
logging.level.sh.stubborn.contract: debug
